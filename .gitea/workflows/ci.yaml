name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    container:
      image: golang:1.25
    steps:
      - name: Checkout
        run: |
          host="${GITHUB_SERVER_URL#https://}"
          host="${host#http://}"
          host="${host%/}"
          git clone --depth 1 "http://x-access-token:${GITHUB_TOKEN}@${host}/${GITHUB_REPOSITORY}.git" .

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...
