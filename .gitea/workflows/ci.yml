name: CI - Meta Repository

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Prevent multiple runs for the same commit/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ══════════════════════════════════════════════════════════════════════════════
# SUBMODULE INIT PATTERN (used in jobs that need cmdr submodule)
# ══════════════════════════════════════════════════════════════════════════════
# - name: Initialize submodules with HTTPS
#   run: |
#     git config --file=.gitmodules submodule.cmdr.url https://github.com/Unimart-For-Operations/cmdr.git
#     git submodule sync
#     git submodule update --init cmdr
# ══════════════════════════════════════════════════════════════════════════════

jobs:
  # ══════════════════════════════════════════════════════════════════════════
  # Job 1: Shell Script Validation
  # ══════════════════════════════════════════════════════════════════════════
  shellcheck:
    name: ShellCheck (Scripts)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run ShellCheck on scripts/
        run: |
          echo "🔍 Checking shell scripts..."
          find scripts/ -type f -name "*.sh" -print0 | while IFS= read -r -d '' script; do
            echo "  → $script"
            shellcheck "$script"
          done

      # Note: cmdr/scripts check requires submodules, skipped for performance

  # ══════════════════════════════════════════════════════════════════════════
  # Job 2: Go Validation (meta + idpbuilder)
  # ══════════════════════════════════════════════════════════════════════════
  go-checks:
    name: Go (fmt, vet, build, test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'  # Match go.mod version
          cache: true

      - name: Go fmt (meta)
        run: |
          echo "🎨 Running go fmt on meta..."
          go fmt ./...

      - name: Go fmt (idpbuilder)
        run: |
          echo "🎨 Running go fmt on idpbuilder..."
          go -C idpbuilder fmt ./...

      - name: Go vet (meta)
        run: |
          echo "🔬 Running go vet on meta..."
          go vet ./...

      - name: Go vet (idpbuilder)
        run: |
          echo "🔬 Running go vet on idpbuilder..."
          go -C idpbuilder vet ./...

      - name: Go build (unimart)
        run: |
          echo "🏗️  Building unimart..."
          VERSION="${GITHUB_SHA::7}"
          COMMIT="${GITHUB_SHA::7}"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          LDFLAGS="-X github.com/Unimart-For-Operations/meta/cmd.Version=${VERSION}"
          LDFLAGS="${LDFLAGS} -X github.com/Unimart-For-Operations/meta/cmd.GitCommit=${COMMIT}"
          LDFLAGS="${LDFLAGS} -X github.com/Unimart-For-Operations/meta/cmd.BuildDate=${DATE}"
          go build -ldflags "${LDFLAGS}" -o unimart .

      - name: Verify unimart binary
        run: |
          echo "✅ Verifying unimart binary..."
          ./unimart version
          ./unimart --help

      - name: Go test (meta)
        run: |
          echo "🧪 Running tests on meta..."
          go test -v ./...

      - name: Go test (idpbuilder)
        run: |
          echo "🧪 Running tests on idpbuilder..."
          go -C idpbuilder test -v ./...

  # ══════════════════════════════════════════════════════════════════════════
  # Job 3: Nix Flake Checks (cmdr)
  # ══════════════════════════════════════════════════════════════════════════
  nix-checks:
    name: Nix (flake check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false
      
      - name: Initialize submodules with HTTPS
        run: |
          git config --file=.gitmodules submodule.cmdr.url https://github.com/Unimart-For-Operations/cmdr.git
          git submodule sync
          git submodule update --init cmdr

      - name: Install Nix
        uses: cachix/install-nix-action@v26
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Enable flakes
        run: |
          mkdir -p ~/.config/nix
          echo "experimental-features = nix-command flakes" >> ~/.config/nix/nix.conf

      - name: Nix flake check (cmdr)
        run: |
          echo "❄️  Running nix flake check on cmdr..."
          cd cmdr
          nix flake check --all-systems

      - name: Nix fmt check (cmdr)
        run: |
          echo "🎨 Checking Nix formatting..."
          cd cmdr
          nix fmt -- --check .

  # ══════════════════════════════════════════════════════════════════════════
  # Job 4: Documentation Validation
  # ══════════════════════════════════════════════════════════════════════════
  docs-checks:
    name: Documentation (markdown, paths)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install markdownlint-cli
        run: |
          sudo npm install -g markdownlint-cli

      - name: Markdown lint
        run: |
          echo "📝 Linting markdown files..."
          # Lint but don't fail on line-length (MD013) or inline HTML (MD033)
          markdownlint '**/*.md' \
            --ignore node_modules \
            --ignore .git \
            --config .markdownlint.json \
            || echo "⚠️  Markdown linting found issues (non-fatal)"
        continue-on-error: true  # Don't fail builds on markdown lint

      - name: Check for old path references
        run: |
          echo "🔍 Checking for stray old path references..."
          
          # Exclude documentation that documents the change itself
          EXCLUDE_DOCS=(
            "./docs/CI.md"
            "./docs/onboarding-improvements-2026-08-31.md"
            "./docs/COMMIT-CHECKLIST.md"
            "./docs/SUMMARY.md"
          )
          
          # Build grep exclude arguments
          GREP_EXCLUDES=""
          for doc in "${EXCLUDE_DOCS[@]}"; do
            GREP_EXCLUDES="$GREP_EXCLUDES --exclude=$(basename $doc)"
          done
          
          # Check for old path pattern (should be zero)
          OLD_PATH_COUNT=$(grep -r "repos/github/idpbuilder" \
            --include="*.md" \
            --include="*.sh" \
            --include="*.nix" \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            $GREP_EXCLUDES \
            . 2>/dev/null | wc -l || echo "0")
          
          if [ "$OLD_PATH_COUNT" -gt 0 ]; then
            echo "❌ Found $OLD_PATH_COUNT references to old path 'repos/github/idpbuilder'"
            echo "   Should be: repos/Unimart-For-Operations/meta"
            echo "   (Excluding docs about the migration itself)"
            echo ""
            grep -rn "repos/github/idpbuilder" \
              --include="*.md" \
              --include="*.sh" \
              --include="*.nix" \
              --exclude-dir=.git \
              --exclude-dir=node_modules \
              $GREP_EXCLUDES \
              . 2>/dev/null || true
            exit 1
          else
            echo "✅ No old path references found (excluding migration docs)"
          fi

      - name: Verify provision.sh exists and is executable
        run: |
          echo "🔍 Checking provision.sh..."
          if [ ! -f scripts/provision.sh ]; then
            echo "❌ scripts/provision.sh not found"
            exit 1
          fi
          if [ ! -x scripts/provision.sh ]; then
            echo "❌ scripts/provision.sh is not executable"
            exit 1
          fi
          echo "✅ provision.sh exists and is executable"

  # ══════════════════════════════════════════════════════════════════════════
  # Job 5: Host Configuration Validation (NixOS)
  # ══════════════════════════════════════════════════════════════════════════
  host-configs:
    name: Host Configs (NixOS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false
      
      - name: Initialize submodules with HTTPS
        run: |
          git config --file=.gitmodules submodule.cmdr.url https://github.com/Unimart-For-Operations/cmdr.git
          git submodule sync
          git submodule update --init cmdr

      - name: Install Nix
        uses: cachix/install-nix-action@v26
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Enable flakes
        run: |
          mkdir -p ~/.config/nix
          echo "experimental-features = nix-command flakes" >> ~/.config/nix/nix.conf

      - name: Validate NixOS host configurations
        run: |
          echo "🖥️  Validating NixOS host configurations..."
          cd cmdr
          
          # Find all NixOS hosts
          for host_dir in home/02-hosts/nixos/*/; do
            host_name=$(basename "$host_dir")
            
            # Skip template and bootstrap docs
            if [ "$host_name" = "_template" ]; then
              continue
            fi
            
            echo ""
            echo "  → Checking $host_name..."
            
            # Check required files exist
            for file in meta.nix default.nix system.nix hardware-configuration.nix; do
              if [ ! -f "${host_dir}${file}" ]; then
                echo "    ❌ Missing ${file}"
                exit 1
              fi
            done
            
            # Evaluate the configuration (don't build, just check syntax)
            echo "    ✓ Files present, evaluating configuration..."
            nix eval --json ".#nixosConfigurations.${host_name}.config.system.build.toplevel" > /dev/null || {
              echo "    ❌ Configuration evaluation failed"
              exit 1
            }
            
            echo "    ✅ ${host_name} configuration is valid"
          done

  # ══════════════════════════════════════════════════════════════════════════
  # Job 6: Cross-Repo Contract Validation (unimart stockroom check)
  # ══════════════════════════════════════════════════════════════════════════
  cross-repo:
    name: Cross-Repo Contracts
    runs-on: ubuntu-latest
    needs: [go-checks]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false
      
      - name: Initialize submodules with HTTPS
        run: |
          git config --file=.gitmodules submodule.cmdr.url https://github.com/Unimart-For-Operations/cmdr.git
          git submodule sync
          git submodule update --init cmdr

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Build unimart
        run: |
          echo "🏗️  Building unimart for stockroom check..."
          go build -o unimart .

      - name: Run stockroom check
        run: |
          echo "🔍 Running cross-repo contract validation..."
          ./unimart stockroom check

  # ══════════════════════════════════════════════════════════════════════════
  # Job 7: Integration Test (provision.sh smoke test)
  # ══════════════════════════════════════════════════════════════════════════
  provision-test:
    name: Provision Script (smoke test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test provision.sh (dry-run)
        run: |
          echo "🧪 Testing provision.sh in dry-run mode..."
          
          # Create a test directory to simulate fresh clone
          TEST_DIR="/tmp/meta-provision-test"
          mkdir -p "$TEST_DIR"
          
          # Copy repo to test directory
          cp -r . "$TEST_DIR/"
          cd "$TEST_DIR"
          
          # Run provision.sh with META_DIR override (don't pollute ~/)
          export META_DIR="$TEST_DIR/test-clone"
          
          # TODO: Add dry-run mode to provision.sh
          # For now, just validate the script is valid bash
          bash -n scripts/provision.sh
          
          echo "✅ provision.sh syntax is valid"

  # ══════════════════════════════════════════════════════════════════════════
  # Summary Job (Requires all checks to pass)
  # ══════════════════════════════════════════════════════════════════════════
  ci-summary:
    name: ✅ All Checks Passed
    runs-on: ubuntu-latest
    needs:
      - shellcheck
      - go-checks
      - nix-checks
      - docs-checks
      - host-configs
      - cross-repo
      - provision-test
    steps:
      - name: Summary
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ All CI checks passed!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "Verified:"
          echo "  ✓ Shell scripts (shellcheck)"
          echo "  ✓ Go code (fmt, vet, build, test)"
          echo "  ✓ Nix flakes (check, fmt)"
          echo "  ✓ Documentation (markdown, path consistency)"
          echo "  ✓ Host configurations (NixOS eval)"
          echo "  ✓ Cross-repo contracts (stockroom)"
          echo "  ✓ Provision script (syntax)"
          echo ""
          echo "Ready to merge! 🎉"
