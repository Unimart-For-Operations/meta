apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{ values.name }}
  description: ${{ values.description }}
  annotations:
    backstage.io/kubernetes-id: ${{ values.name }}
    argocd/app-name: ${{ values.name }}
    backstage.io/techdocs-ref: dir:.
  tags:
    - elixir
    - phoenix
    - microservice
spec:
  type: service
  lifecycle: experimental
  owner: ${{ values.owner }}
  system: idp-platform
