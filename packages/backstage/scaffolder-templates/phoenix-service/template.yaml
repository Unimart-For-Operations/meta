apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: phoenix-service
  title: Elixir Phoenix Service
  description: Create a new Elixir/Phoenix microservice with Nix devShell, container build, and platform manifests
  tags:
    - elixir
    - phoenix
    - microservice
spec:
  owner: platform-team
  type: service

  parameters:
    - title: Service Information
      required:
        - name
        - moduleName
        - description
      properties:
        name:
          title: Service Name
          type: string
          description: Unique name for this service (lowercase, hyphens allowed)
          pattern: '^[a-z][a-z0-9-]*$'
          ui:autofocus: true
          ui:help: 'Example: docs-service, billing-api'

        moduleName:
          title: Elixir Module Name
          type: string
          description: Root Elixir module (PascalCase)
          pattern: '^[A-Z][A-Za-z0-9]*$'
          ui:help: 'Example: DocsService, BillingApi'

        appName:
          title: OTP App Name
          type: string
          description: OTP application name (snake_case). Defaults to the service name with underscores.
          pattern: '^[a-z][a-z0-9_]*$'
          ui:help: 'Example: docs_service'

        description:
          title: Description
          type: string
          description: Short description of what this service does

        owner:
          title: Owner
          type: string
          description: Team or user responsible for this service
          default: platform-team
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: [Group, User]

    - title: Configuration
      required:
        - port
      properties:
        port:
          title: Service Port
          type: integer
          description: HTTP port the service will listen on
          default: 4000
          minimum: 1024
          maximum: 65535

    - title: Repository
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - my-gitea-http.gitea.svc.cluster.local:3000
            allowedOwners:
              - giteaAdmin

  steps:
    - id: fetch-base
      name: Fetch Base Template
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          moduleName: ${{ parameters.moduleName }}
          appName: ${{ parameters.appName if parameters.appName else parameters.name | replace("-", "_") }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          port: ${{ parameters.port }}
          destination: ${{ parameters.repoUrl | parseRepoUrl }}

    - id: publish
      name: Publish to Gitea
      action: publish:gitea
      input:
        description: ${{ parameters.description }}
        repoUrl: ${{ parameters.repoUrl }}
        defaultBranch: main
        repoVisibility: public

    - id: register
      name: Register Component
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

  output:
    links:
      - title: Repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Open in Catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
