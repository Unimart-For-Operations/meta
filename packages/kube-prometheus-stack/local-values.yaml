# Local-dev overrides for the kube-prometheus-stack chart.
# Keeps the full monitoring stack but pins modest resource requests so it
# runs comfortably on the single-node IDP Kind cluster.

# CRDs are NOT applied via the upgradeJob hook: the hook bundles the CRDs as
# a binary ConfigMap (crds.bz2) whose full manifest exceeds ArgoCD's 262KB
# annotation limit, so every sync fails at the PreSync step. Instead the
# ArgoCD Application sets helm.includeCrds: true so the CRD files render as
# plain manifests in the sync.
crds:
  upgradeJob:
    enabled: false

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 96Mi

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 50m
        memory: 96Mi

prometheus:
  prometheusSpec:
    resources:
      requests:
        cpu: 200m
        memory: 512Mi

grafana:
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - grafana.cnoe.localtest.me
  resources:
    requests:
      cpu: 100m
      memory: 128Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi