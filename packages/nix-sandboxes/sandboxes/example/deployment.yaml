apiVersion: apps/v1
kind: Deployment
metadata:
  name: example-sandbox
  namespace: sandboxes
  labels:
    app: example-sandbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app: example-sandbox
  template:
    metadata:
      labels:
        app: example-sandbox
    spec:
      serviceAccountName: example-sandbox
      containers:
        # Keep the sandbox alive; the terminal sidecar is the access point.
        - name: nix
          image: nixos/nix:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              echo "Nix sandbox 'example' ready"
              sleep infinity
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
