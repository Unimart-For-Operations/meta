apiVersion: v1
kind: ServiceAccount
metadata:
  name: example-sandbox
  namespace: sandboxes
---
# Terminal access: allows kubectl exec into the sandbox's own pod so the
# ttyd browser shell can attach to the `nix` container.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: example-sandbox-exec
  namespace: sandboxes
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: example-sandbox-exec
  namespace: sandboxes
subjects:
  - kind: ServiceAccount
    name: example-sandbox
    namespace: sandboxes
roleRef:
  kind: Role
  name: example-sandbox-exec
  apiGroup: rbac.authorization.k8s.io
