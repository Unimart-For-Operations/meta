apiVersion: apps/v1
kind: Deployment
metadata:
  name: personal-blog
  namespace: default
  labels:
    app: personal-blog
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: personal-blog
  template:
    metadata:
      labels:
        app: personal-blog
        version: v1
    spec:
      serviceAccountName: personal-blog
      containers:
      - name: personal-blog
        image: personal-blog:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 4000
          name: http
          protocol: TCP
        env:
        - name: PORT
          value: "4000"
        - name: PHX_HOST
          valueFrom:
            configMapKeyRef:
              name: personal-blog-config
              key: phx_host
        - name: SECRET_KEY_BASE
          valueFrom:
            secretKeyRef:
              name: personal-blog-secrets
              key: secret_key_base
        - name: GITEA_URL
          valueFrom:
            configMapKeyRef:
              name: personal-blog-config
              key: gitea_url
        - name: GITEA_TOKEN
          valueFrom:
            secretKeyRef:
              name: personal-blog-secrets
              key: gitea_token
              optional: true
        - name: GITEA_USER
          valueFrom:
            configMapKeyRef:
              name: personal-blog-config
              key: gitea_user
        - name: BLOG_CACHE_TTL
          valueFrom:
            configMapKeyRef:
              name: personal-blog-config
              key: cache_ttl
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 3
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 1
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "384Mi"
            cpu: "500m"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL
